* { box-sizing: border-box; }

.cost { position: absolute; top: -10px; left: -10px; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 45%, var(--gold-deep)); color: #2b1d00; font-weight: bold; font-size: 20px; display: grid; place-items: center; border: 2px solid #5a3e06; }

.text b { color: var(--kw); font-weight: normal; }

.kw { display: block; color: var(--kw); margin-top: 4px; }

.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

.legend { color: var(--muted); font-size: 13px; }

t card you played this turn again, if it's in your Discard Pile.", "art": "A teleprompter screen reading 'REPEAT THE LINE' glowing in a dark hall."}, {"id": "MomentOfClarity", "name": "Moment of Clarity", "rarity": "Rare", "type": "Skill", "cost": 1, "target": "Self", "arch": "Tangents", "text": "This turn, your Tangent cards do all their lines.", "kw": ["Exhaust"], "up": "No longer Exhausts.", "art": "A beam of golden light breaking through a fog of speech bubbles."}, {"id": "BuildBackBetter", "name": "Build Back Better", "rarity": "Rare", "type": "Skill", "cost": 2, "cost_up": 1, "target": "Self", "arch": "General", "text": "Discard your hand, then draw that many cards. Upgrade them for the rest of combat.", "art": "Joe in a hard hat cutting a ribbon with a giant pair of ceremonial scissors in front of a shiny new bridge over a monster-filled moat."}, {"id": "IceCreamTruck", "name": "Ice Cream Truck", "rarity": "Rare", "type": "Skill", "cost": 1, "target": "Self", "arch": "General", "text": "Heal {6|9} HP.", "kw": ["Exhaust"], "art": "An ice cream truck pulling up in the middle of a dungeon, jingle notes floating, monsters lining up at the window."}, {"id": "DarkBrandonRises", "name": "Dark Brandon Rises", "rarity": "Rare", "type": "Power", "cost": 3, "cost_up": 2, "target": "Self", "arch": "Brandon", "text": "At the start of your turn, wake up.", "art": "Joe as Dark Brandon seen from a very low angle as a towering full-body figure on a mountain peak, arms spread wide, aviators blazing red, a giant red sun rising behind him and a cape of flags whipping in the wind.", "art_background": "crimson sunset background with black silhouette shapes", "note": "Every turn is a Dark Brandon turn: Tangents do everything, but Drowsy never builds, so Laser Eyes stay small."}, {"id": "NoMalarkey", "name": "No Malarkey", "rarity": "Rare", "type": "Power", "cost": 1, "target": "Self", "arch": "Brandon", "text": "Whenever you wake up, gain {1|2} Strength.", "art": "A pile of nonsense papers bursting into red flame on a desk, a pair of aviators reflecting the fire."}, {"id": "DoubleVision", "name": "Double Vision", "rarity": "Rare", "type": "Power", "cost": 2, "cost_up": 1, "target": "Self", "arch": "Brandon", "text": "Laser Eyes hit twice.", "art": "Four red laser beams crossing in the dark, fired from two overlapping pairs of glowing red aviator lenses."}, {"id": "WellRested", "name": "Well Rested", "rarity": "Rare", "type": "Power", "cost": 1, "target": "Self", "arch": "Nap", "text": "Whenever you nod off, gain 1 Dexterity.", "up": "Innate.", "art": "Joe waking up refreshed in a four-poster bed, stretching with a huge satisfied grin."}, {"id": "HeavySleeper", "name": "Heavy Sleeper", "rarity": "Rare", "type": "Power", "cost": 1, "target": "Self", "arch": "Nap", "text": "Your nod-off line is {5|8} higher.", "art": "A marching band of little goblins with drums and horns parading past a four-poster bed with a snoring lump under the covers.", "note": "Bigger naps, bigger Laser Eyes, slower cycles. Copies stack."}, {"id": "OffScript", "name": "Off Script", "rarity": "Rare", "type": "Power", "cost": 2, "cost_up": 1, "target": "Self", "arch": "Tangents", "text": "The first Tangent card you play each turn does all its lines.", "art": "Joe crumpling up a teleprompter script and grinning; the audience of monsters gasps."}, {"id": "TallTales", "name": "Tall Tales", "rarity": "Rare", "type": "Power", "cost": 1, "target": "Self", "arch": "Tangents", "text": "Whenever a Tangent card changes line, its damage and Block go up by 1 for the rest of combat.", "up": "Innate.", "art": "A fish growing bigger in every speech bubble, until the last one holds a whale."}, {"id": "GaffeMachine", "name": "Gaffe Machine", "rarity": "Rare", "type": "Power", "cost": 1, "target": "Self", "arch": "General", "text": "At the start of your turn, {1|2} random card(s) in your hand cost 0 this turn.", "art": "A clanking contraption with gears and a microphone, spitting out mixed-up words and happy accidents."}, {"id": "InfrastructureLaw", "name": "Infrastructure Law", "rarity": "Rare", "type": "Power", "cost": 3, "cost_up": 2, "target": "Self", "arch": "General", "text": "At the start of your turn, gain 1 Energy.", "art": "A giant signed bill unfolding into bridges, roads and railways like a pop-up book."}, {"id": "StateOfTheUnion", "name": "State of the Union", "rarity": "Ancient", "type": "Attack", "cost": 1, "target": "AllEnemies", "arch": "Brandon", "text": "Wake Up. Deal {14|20} damage to ALL enemies.", "art": "Joe as Dark Brandon at a grand podium under a vaulted hall, laser eyes blazing red as the whole chamber shakes."}, {"id": "SoulOfTheNation", "name": "Soul of the Nation", "rarity": "Ancient", "type": "Power", "cost": 2, "cost_up": 1, "target": "Self", "arch": "General", "text": "At the start of your turn, gain 5 Block and draw 1 card. Laser Eyes deal 10 more damage.", "art": "A hilltop at sunrise with a giant glowing flag unfurling over a vast valley, the Spire far away on the horizon."}], "relics": [{"id": "AviatorShades", "name": "Aviator Shades", "rarity": "Starter", "text": "At the end of your turn, Doze 3. When you nod off, gain 8 Block.", "flavor": "Nobody can tell whether his eyes are open. That's the point."}, {"id": "DarkAviators", "name": "Dark Aviators", "rarity": "Ancient (starter upgrade)", "text": "At the end of your turn, Doze 3. When you nod off, gain 14 Block.", "flavor": "Replaces Aviator Shades via Touch of Orobas. They glow a little. Nobody asks."}, {"id": "TravelPillow", "name": "Travel Pillow", "rarity": "Common", "text": "Whenever you Doze, Doze 1 additional.", "flavor": "Amtrak-approved. Smells faintly of the Northeast Corridor."}, {"id": "IceCreamCone", "name": "Ice Cream Cone", "rarity": "Uncommon", "text": "Whenever you wake up, heal 3 HP.", "flavor": "Chocolate chip. Always chocolate chip."}, {"id": "IndexCards", "name": "Index Cards", "rarity": "Uncommon", "text": "Whenever you play a Tangent card on its last line, draw 1 card.", "flavor": "Numbered, then dropped, then renumbered. Mostly."}, {"id": "Corvette", "name": "'67 Corvette", "rarity": "Rare", "text": "Whenever you wake up, draw 2 cards.", "flavor": "Zero to sixty faster than you can say 'here's the deal'."}, {"id": "DarkBrandonMug", "name": "Dark Brandon Mug", "rarity": "Rare", "text": "Laser Eyes deal 50% more damage.", "flavor": "Hot coffee. Hotter stare."}, {"id": "Teleprompter", "name": "Teleprompter", "rarity": "Rare", "text": "Whenever you wake up, your Tangent cards cost 0 this turn.", "flavor": "Reads everything on the screen. Everything."}, {"id": "AmtrakPass", "name": "Amtrak Pass", "rarity": "Shop", "text": "The first time you play 5 cards in a turn, gain 1 Energy.", "flavor": "Good for one ride a day. He takes eight."}], "potions": [{"id": "WarmMilk", "name": "Warm Milk", "rarity": "Common", "text": "Doze 8."}, {"id": "EspressoShot", "name": "Espresso Shot", "rarity": "Uncommon", "text": "Wake Up. Draw 2 cards."}, {"id": "DarkRoast", "name": "Dark Roast", "rarity": "Rare", "text": "Wake Up. This turn, your Attacks deal double damage."}]};
const RARITIES = ["Basic","Common","Uncommon","Rare","Ancient","Token"];
const TYPES = ["Attack","Skill","Power"];
const ARCHES = ["Wall","Deport","Deals","Tweets","General"];
const state = { rarity: new Set(), type: new Set(), arch: new Set(), upgraded: false, notes: false };
const KW = /\b(Build|Wall|Deport(?:ed)?|Tariff|Tweets?|Pay \d+ Gold|Block|Weak|Vulnerable|Strength|Intangible|Exhaust|Retain|Innate|Energy|Gold)\b/g;
function esc(s) { return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function render(text, up) {
  let t = esc(text).replace(/\{([^|}]*)\|([^}]*)\}/g, (m, a, b) => up && a !== b ? `\u0000${b}\u0001` : (up ? b : a));
  t = t.replace(KW, "<b>$1</b>");
  return t.replace(/\u0000/g, '<span class="up">').replace(/\u0001/g, "</span>");
}
function chips(id, values, key) {
  const box = document.getElementById(id);
  values.forEach(v => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = v;
    b.onclick = () => { state[key].has(v) ? state[key].delete(v) : state[key].add(v); b.classList.toggle("on"); draw(); };
    box.appendChild(b);
  });
}
function draw() {
  const grid = document.getElementById("grid"); grid.innerHTML = ""; let n = 0;
  const order = c => [RARITIES.indexOf(c.rarity), TYPES.indexOf(c.type), ARCHES.indexOf(c.arch)];
  [...DATA.cards].sort((a, b) => { const x = order(a), y = order(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; })
  .forEach(c => {
    if (state.rarity.size && !state.rarity.has(c.rarity)) return;
    if (state.type.size && !state.type.has(c.type)) return;
    if (state.arch.size && !state.arch.has(c.arch)) return;
    n++;
    const up = state.upgraded;
    const cost = up && c.cost_up !== undefined ? `<span class="up">${c.cost_up}</span>` : c.cost;
    const kws = (c.kw || []).filter(k => !(up && c.up && c.up.includes("No longer Exhausts") && k === "Exhaust"));
    const extra = up && c.up ? `<span class="kw up">${esc(c.up)}</span>` : "";
    const el = document.createElement("div"); el.className = "card"; el.dataset.rarity = c.rarity;
    el.innerHTML = `<div class="cost">${cost}</div>
      <div class="name">${esc(c.name)}${up ? "+" : ""}</div>
      <div class="art">${esc(c.art || "")}</div>
      <div class="type ${c.type}">${c.type}</div>
      <div class="text">${render(c.text, up)}${kws.length ? `<span class="kw">${kws.join(". ")}.</span>` : ""}${extra}${c.mp ? '<span class="kw">Co-op only.</span>' : ""}</div>
      ${state.notes && c.note ? `<div class="note">${esc(c.note)}</div>` : ""}
      <div class="foot"><span class="rar ${c.rarity}">${c.rarity}</span><span>${c.arch}</span></div>`;
    grid.appendChild(el);
  });
  document.getElementById("count").textContent = `${n} shown`;
}
function items(id, list) {
  const box = document.getElementById(id);
  list.forEach(r => {
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = `<h3>${esc(r.name)} <span class="rar ${r.rarity.split(" ")[0]}" style="font-size:12px">${esc(r.rarity)}</span></h3>
      <div>${render(r.text, false)}</div>${r.flavor ? `<div class="flav">${esc(r.flavor)}</div>` : ""}`;
    box.appendChild(el);
  });
}
chips("f-rarity", RARITIES, "rarity"); chips("f-type", TYPES, "type"); chips("f-arch", ARCHES, "arch");
document.getElementById("upgraded").onchange = e => { state.upgraded = e.target.checked; draw(); };
document.getElementById("notes").onchange = e => { state.notes = e.target.checked; draw(); };
items("relics", DATA.relics); items("potions", DATA.potions); draw();
</script>
